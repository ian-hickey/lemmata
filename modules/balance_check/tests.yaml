cases:
- name: balances exactly
  inputs: [1000, 600, 400, 0]
  expect: true
- name: off by one within tolerance
  inputs: [1001, 600, 400, 1]
  expect: true
- name: off by two beyond tolerance
  inputs: [1002, 600, 400, 1]
  expect: false
- name: negative equity
  inputs: [1000, 1200, -200, 0]
  expect: true
- name: all zero
  inputs: [0, 0, 0, 0]
  expect: true
- name: rounded presentation figures
  inputs: [1234567, 890123, 344443, 1]
  expect: true
- name: large imbalance
  inputs: [1000, 100, 100, 0]
  expect: false
- name: negative tolerance
  inputs: [1000, 600, 400, -1]
  expect: '#NUM!'
- name: text assets
  inputs: [x, 600, 400, 0]
  expect: '#VALUE!'
- name: boolean tolerance
  inputs: [1000, 600, 400, true]
  expect: '#VALUE!'
