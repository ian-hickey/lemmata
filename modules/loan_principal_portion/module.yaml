id: loan_principal_portion
name: LEMMA.LOAN_PRINCIPAL_PORTION
version: 0.1.0
summary: 'Principal repaid by one payment of a level-payment loan: the payment less the interest part of that payment.'
definition:
  source: Wikipedia, Amortization schedule
  url: https://en.wikipedia.org/wiki/Amortization_schedule
  formula: LEMMA.LOAN_PAYMENT(principal, rate, periods) - LEMMA.LOAN_INTEREST_PORTION(principal, rate, periods, period)
parameters:
- name: principal
  type: number
  unit: currency
  description: Amount borrowed. Must be zero or greater.
- name: rate
  type: number
  unit: decimal rate per period
  description: Interest rate per period. Must be 0 or at least 0.000001.
- name: periods
  type: number
  unit: periods
  description: Total number of payments. Must be a positive whole number.
- name: period
  type: number
  unit: periods
  description: Which payment, counting from 1. A whole number from 1 to periods.
returns:
  type: number
  unit: currency
  description: Principal part of that payment, as a positive amount.
errors:
  '#VALUE!': An argument is not a number.
  '#NUM!': principal is negative, rate is negative or nonzero below 0.000001, periods is not a positive whole number, or period is not a whole number from 1 to periods.
conventions:
- Equals -PPMT(rate, period, periods, principal) in Excel.
- The principal portions over all periods sum to the principal.
- Nonzero rates below 0.000001 are rejected because the closed form loses precision there; use rate 0 for an interest-free loan.
tags:
- finance
- loans
- amortization
dependencies:
- id: loan_payment
  module_hash: 4bfe72dc102fce277814f695325b282fe6b01423a3c09f2edae22f64fde891aa
- id: loan_interest_portion
  module_hash: 2ddb61ea40d36c74078c776f709a2532e4d71ff5d69ba3b9ce8a263ae697f097
