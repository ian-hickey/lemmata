cases:
- name: microsoft syd example, first year
  inputs: [30000, 7500, 10, 1]
  expect: 4090.909090909091
  source: computed; https://support.microsoft.com/en-us/office/syd-function-069f8106-b60b-4ca2-98e0-2a0f206bdb27 shows 4,090.91
- name: microsoft syd example, tenth year
  inputs: [30000, 7500, 10, 10]
  expect: 409.09090909090907
  source: computed; the same page shows 409.09
- name: middle year
  inputs: [30000, 7500, 10, 5]
  expect: 2454.5454545454545
- name: single period life
  inputs: [1000, 100, 1, 1]
  expect: 900
- name: no salvage
  inputs: [5000, 0, 4, 2]
  expect: 1500
- name: period zero
  inputs: [1000, 100, 5, 0]
  expect: '#NUM!'
- name: period beyond life
  inputs: [1000, 100, 5, 6]
  expect: '#NUM!'
- name: fractional life
  inputs: [1000, 100, 5.5, 1]
  expect: '#NUM!'
- name: cost below salvage
  inputs: [100, 200, 5, 1]
  expect: '#NUM!'
- name: text cost
  inputs: [x, 7500, 10, 1]
  expect: '#VALUE!'
- name: boolean period
  inputs: [30000, 7500, 10, true]
  expect: '#VALUE!'
