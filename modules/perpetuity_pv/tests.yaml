cases:
- name: level perpetuity of 100 at 5 percent
  inputs: [100, 0.05, 0]
  expect: 2000
- name: growing at 2 percent
  inputs: [100, 0.05, 0.02]
  expect: 3333.333333333333
- name: shrinking payment
  inputs: [100, 0.05, -0.03]
  expect: 1250
- name: large rate
  inputs: [1, 1, 0]
  expect: 1
- name: negative payment keeps sign
  inputs: [-100, 0.1, 0]
  expect: -1000
- name: rate equal to growth
  inputs: [100, 0.05, 0.05]
  expect: '#NUM!'
- name: rate below growth
  inputs: [100, 0.03, 0.05]
  expect: '#NUM!'
- name: growth of minus one
  inputs: [100, 0.05, -1]
  expect: '#NUM!'
- name: text payment
  inputs: [x, 0.05, 0]
  expect: '#VALUE!'
- name: boolean growth
  inputs: [100, 0.05, true]
  expect: '#VALUE!'
