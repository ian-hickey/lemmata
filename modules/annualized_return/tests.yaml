cases:
- name: 50 percent over three years
  inputs: [0.5, 3]
  expect: 0.14471424255333187
- name: doubling over ten years
  inputs: [1, 10]
  expect: 0.07177346253629313
- name: one year is unchanged
  inputs: [0.07, 1]
  expect: 0.07000000000000006
- name: six months annualized
  inputs: [0.03, 0.5]
  expect: 0.060899999999999954
- name: loss over two years
  inputs: [-0.19, 2]
  expect: -0.09999999999999998
- name: total loss
  inputs: [-1, 3]
  expect: -1
- name: zero return
  inputs: [0, 5]
  expect: 0
- name: return below minus one
  inputs: [-1.5, 2]
  expect: '#NUM!'
- name: zero years
  inputs: [0.1, 0]
  expect: '#NUM!'
- name: text total_return
  inputs: [x, 3]
  expect: '#VALUE!'
- name: boolean years
  inputs: [0.5, true]
  expect: '#VALUE!'
