cases:
- name: 10,000 fixed, 20 price, 12 variable
  inputs: [10000, 20, 12]
  expect: 1250
- name: no variable cost
  inputs: [10000, 20, 0]
  expect: 500
- name: no fixed costs
  inputs: [0, 20, 12]
  expect: 0
- name: fractional result
  inputs: [1000, 15, 8]
  expect: 142.85714285714286
- name: fractional inputs
  inputs: [2500.5, 9.99, 4.49]
  expect: 454.6363636363636
- name: price equal to variable cost
  inputs: [1000, 10, 10]
  expect: '#NUM!'
- name: price below variable cost
  inputs: [1000, 8, 10]
  expect: '#NUM!'
- name: negative fixed costs
  inputs: [-1, 20, 12]
  expect: '#NUM!'
- name: negative variable cost
  inputs: [1000, 20, -1]
  expect: '#NUM!'
- name: text fixed_costs
  inputs: [x, 20, 12]
  expect: '#VALUE!'
- name: boolean variable_cost
  inputs: [10000, 20, true]
  expect: '#VALUE!'
