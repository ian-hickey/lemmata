id: annuity_fv
name: LEMMA.ANNUITY_FV
version: 0.1.0
summary: Future value at the end of the last period of a level payment made at the end of each period (an ordinary annuity).
definition:
  source: Wikipedia, Annuity, future value of an annuity-immediate
  url: https://en.wikipedia.org/wiki/Annuity#Future_value_of_an_annuity-immediate
  formula: payment * ((1 + rate) ^ periods - 1) / rate, or payment * periods when rate is 0
parameters:
- name: payment
  type: number
  unit: currency per period
  description: Amount paid at the end of each period. Any sign.
- name: rate
  type: number
  unit: decimal rate per period
  description: Growth rate for one period. Must be greater than -1.
- name: periods
  type: number
  unit: periods
  description: Number of payments. Must be zero or greater.
returns:
  type: number
  unit: currency
  description: Accumulated value when the last payment is made.
errors:
  '#VALUE!': An argument is not a number.
  '#NUM!': rate is -1 or less, or periods is negative.
conventions:
- Payments fall at the end of each period. Multiply by (1 + rate) for payments in advance.
- Equals Excel FV(rate, periods, -payment).
tags:
- finance
- time value of money
- annuity
dependencies: []
