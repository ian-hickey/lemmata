name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - name: Spec check
        run: uv run lemma check
      - name: Module tests on IronCalc
        run: uv run lemma test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: js
      - name: JavaScript tests
        run: npm test
        working-directory: js
      - name: Tooling tests
        run: uv run pytest -q
      - name: Build static registry
        run: uv run lemma build-index --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: registry
          path: dist/
