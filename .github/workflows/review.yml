# The AI reviewer. Runs with the trusted tooling from main and only the pull
# request's modules/ folder, so a pull request can change what is reviewed but
# not how. It posts its evidence as a comment, stores an approved module's
# report on the review-records branch (which only this workflow writes, keyed
# by module hash and attested), fails this check on a deny, and enables
# auto-merge only when every changed file is a module file. Anything else
# needs a code owner's approval.
name: review

on:
  pull_request_target:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
      model:
        description: Reviewer model (use a different model from the author's)
        required: false
      modules:
        description: Space-separated module ids to review in addition to the changed ones
        required: false

permissions:
  contents: write        # enabling auto-merge; the checkout keeps no credential
  pull-requests: write
  id-token: write        # attestations for review records
  attestations: write

concurrency:
  group: review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

env:
  RECORDS_BRANCH: review-records

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      PR: ${{ github.event.pull_request.number || inputs.pr }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - name: Sandbox image for the reference implementation
        run: docker pull -q python:3.12-slim
      - name: Bring in the pull request's modules and the trusted review records
        id: prep
        run: |
          git fetch --no-tags "https://github.com/$GITHUB_REPOSITORY" "pull/$PR/head:pr"
          { git diff --name-only HEAD pr -- modules/ | sed -n 's|^modules/\([^/]*\)/.*|\1|p'; echo "${{ inputs.modules }}" | tr ' ' '\n'; } | grep . | sort -u > changed.txt
          git checkout pr -- modules/
          mkdir -p records/reviews
          if git fetch --no-tags "https://github.com/$GITHUB_REPOSITORY" "$RECORDS_BRANCH:records-branch" 2>/dev/null; then
            git archive records-branch | tar -x -C records
          fi
          ls records/reviews | grep -c '\.md$' | xargs -I{} echo "{} trusted records"
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json files -q '.files[].path' > files.txt
          if grep -vqE '^modules/[a-z][a-z0-9_]*/(module\.yaml|formula\.lambda|tests\.yaml|README\.md)$' files.txt; then
            echo "module_only=false" >> "$GITHUB_OUTPUT"
            echo "pull request changes files outside module folders; a code owner must approve it"
          else
            echo "module_only=true" >> "$GITHUB_OUTPUT"
          fi
          echo "modules to review: $(tr '\n' ' ' < changed.txt)"
      - name: Review
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LEMMATA_REVIEW_MODEL: ${{ inputs.model || vars.LEMMATA_REVIEW_MODEL }}
          LEMMATA_SANDBOX: docker
        run: |
          ids=$(tr '\n' ' ' < changed.txt)
          if [ -z "$ids" ]; then
            echo "verdict=skip" >> "$GITHUB_OUTPUT"
            echo "No module changed; nothing to review."
            exit 0
          fi
          ls records/reviews > before.txt
          set +e
          uv run lemma review $ids --markdown report.md --records-dir records/reviews --skip-recorded --verify-records "$GITHUB_REPOSITORY"
          code=$?
          set -e
          [ -f report.md ] || printf '## Lemmata review\n\nThe reviewer could not run (exit %s). See the workflow log.\n' "$code" > report.md
          ls records/reviews > after.txt
          mkdir -p new-records
          comm -13 before.txt after.txt | while read -r f; do [ -n "$f" ] && cp "records/reviews/$f" new-records/; done
          echo "new=$(ls new-records | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then echo "verdict=approve" >> "$GITHUB_OUTPUT"; else echo "verdict=deny" >> "$GITHUB_OUTPUT"; fi
      - name: Post the report
        if: steps.review.outputs.verdict != 'skip'
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file report.md
      - name: Attest the new review records
        if: steps.review.outputs.new != '0' && steps.review.outputs.new != ''
        uses: actions/attest@v2
        with:
          subject-path: new-records/*.md
          predicate-type: https://lemmata.dev/review-record/v1
          predicate: '{"workflow":"review","trigger":"${{ github.event_name }}"}'
      - name: Store the new records on the review-records branch
        if: steps.review.outputs.new != '0' && steps.review.outputs.new != ''
        env:
          PUSH_TOKEN: ${{ secrets.LEMMATA_BOT_TOKEN }}
        run: |
          if [ -z "$PUSH_TOKEN" ]; then
            echo "LEMMATA_BOT_TOKEN is not set; records were attested but not stored"
            exit 0
          fi
          login=$(GH_TOKEN="$PUSH_TOKEN" gh api user -q .login)
          uid=$(GH_TOKEN="$PUSH_TOKEN" gh api user -q .id)
          url="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git show-ref --quiet refs/heads/records-branch; then
            git worktree add -q rec records-branch
          else
            git worktree add -q --detach rec
            git -C rec checkout -q --orphan "$RECORDS_BRANCH"
            git -C rec rm -rfq . 2>/dev/null || true
            printf '# Review records\n\nWritten only by the review workflow. One report per approved module hash under reviews/, and history.json listing every published hash.\n' > rec/README.md
          fi
          mkdir -p rec/reviews
          cp new-records/*.md rec/reviews/
          git -C rec config user.name "$login"
          git -C rec config user.email "${uid}+${login}@users.noreply.github.com"
          git -C rec add -A
          git -C rec commit -q -m "Review records for $(tr '\n' ' ' < changed.txt | sed 's/ *$//') (PR #$PR)"
          for attempt in 1 2 3; do
            if git -C rec push -q "$url" "HEAD:refs/heads/$RECORDS_BRANCH"; then echo "records stored"; break; fi
            git -C rec fetch -q "$url" "$RECORDS_BRANCH" && git -C rec rebase -q FETCH_HEAD || true
          done
      - name: Enable auto-merge for a module-only pull request
        if: steps.review.outputs.verdict == 'approve'
        run: |
          if [ "${{ steps.prep.outputs.module_only }}" = "true" ]; then
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash || echo "could not enable auto-merge; merge once checks pass"
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "The reviewer approved the module changes, but this pull request also changes files outside module folders, so a code owner must approve it before it merges."
          fi
      - name: Gate on the verdict
        if: steps.review.outputs.verdict == 'deny'
        run: |
          echo "The reviewer denied at least one module. See the report comment."
          exit 1
