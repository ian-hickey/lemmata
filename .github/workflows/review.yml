# The AI reviewer. Runs with the trusted tooling from the base branch and only
# the pull request's modules/ folder, so a pull request can change what is
# reviewed but not how it is reviewed. It posts its evidence as a comment,
# fails this check when it denies, and enables auto-merge when it approves so
# the pull request lands once every required check passes.
name: review

on:
  pull_request_target:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
      model:
        description: Reviewer model (use a different model from the author's)
        required: false
      modules:
        description: Space-separated module ids to review in addition to the changed ones
        required: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  review:
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.review.outputs.verdict }}
    env:
      PR: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - name: Bring in the pull request's modules and review records only
        run: |
          git fetch --no-tags origin "pull/$PR/head:pr"
          { git diff --name-only HEAD pr -- modules/ | sed -n 's|^modules/\([^/]*\)/.*|\1|p'; echo "${{ inputs.modules }}" | tr ' ' '\n'; } | grep . | sort -u > changed.txt
          git checkout pr -- modules/
          git checkout pr -- reviews/ 2>/dev/null || true
          echo "modules to review: $(tr '\n' ' ' < changed.txt)"
      - name: Review
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LEMMATA_REVIEW_MODEL: ${{ inputs.model || vars.LEMMATA_REVIEW_MODEL }}
        run: |
          ids=$(tr '\n' ' ' < changed.txt)
          if [ -z "$ids" ]; then
            echo "verdict=skip" >> "$GITHUB_OUTPUT"
            echo "No module changed; nothing to review."
            exit 0
          fi
          set +e
          uv run lemma review $ids --markdown report.md --records-dir reviews --skip-recorded
          code=$?
          set -e
          [ -f report.md ] || printf '## Lemmata review\n\nThe reviewer could not run (exit %s). See the workflow log.\n' "$code" > report.md
          if [ "$code" -eq 0 ]; then echo "verdict=approve" >> "$GITHUB_OUTPUT"; else echo "verdict=deny" >> "$GITHUB_OUTPUT"; fi
      - name: Post the report
        if: steps.review.outputs.verdict != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "$PR" --body-file report.md
      - name: Record approvals on the pull request branch
        if: steps.review.outputs.verdict == 'approve'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ -z "$(git status --porcelain reviews/)" ]; then
            echo "no new records"
          elif [ -z "$HEAD_REF" ]; then
            echo "dispatch run: records not pushed; use the pull request event"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git stash push -q -- reviews/
            git checkout -q pr
            git stash pop -q
            git add reviews/
            git commit -q -m "Record AI review approval for $(tr '\n' ' ' < changed.txt | sed 's/ *$//')"
            git push origin "HEAD:refs/heads/$HEAD_REF"
            echo "records pushed; the next run will find them and enable auto-merge"
            exit 0
          fi
          gh pr merge "$PR" --auto --squash || echo "could not enable auto-merge; merge once checks pass"
      - name: Gate on the verdict
        if: steps.review.outputs.verdict == 'deny'
        run: |
          echo "The reviewer denied this module. See the report comment."
          exit 1

  # A merge performed by the Actions token does not trigger push workflows, so
  # once auto-merge lands the pull request this job dispatches publish itself.
  publish-after-merge:
    needs: review
    if: needs.review.outputs.verdict == 'approve'
    runs-on: ubuntu-latest
    env:
      PR: ${{ github.event.pull_request.number || inputs.pr }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for the merge, then publish
        run: |
          for i in $(seq 1 45); do
            state=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state -q .state)
            case "$state" in
              MERGED)
                gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main
                echo "merged; publish dispatched"
                exit 0 ;;
              CLOSED)
                echo "closed without merging"
                exit 0 ;;
            esac
            sleep 20
          done
          echo "not merged within 15 minutes; the hourly publish backstop will pick it up"
