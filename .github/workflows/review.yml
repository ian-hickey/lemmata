# The AI reviewer. Runs with the trusted tooling from the base branch and only
# the pull request's modules/ folder, so a pull request can change what is
# reviewed but not how it is reviewed. It posts its evidence as a comment,
# fails this check when it denies, and enables auto-merge when it approves so
# the pull request lands once every required check passes.
name: review

on:
  pull_request_target:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
      model:
        description: Reviewer model (use a different model from the author's)
        required: false
      modules:
        description: Space-separated module ids to review in addition to the changed ones
        required: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false   # a run dispatches a successor after pushing records; it must not cancel itself

jobs:
  review:
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.review.outputs.verdict }}
    env:
      PR: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the tooling always comes from main, whatever triggered the run
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - name: Bring in the pull request's modules and review records only
        run: |
          git fetch --no-tags origin "pull/$PR/head:pr"
          { git diff --name-only HEAD pr -- modules/ | sed -n 's|^modules/\([^/]*\)/.*|\1|p'; echo "${{ inputs.modules }}" | tr ' ' '\n'; } | grep . | sort -u > changed.txt
          git checkout pr -- modules/
          git checkout pr -- reviews/ 2>/dev/null || true
          echo "modules to review: $(tr '\n' ' ' < changed.txt)"
      - name: Review
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LEMMATA_REVIEW_MODEL: ${{ inputs.model || vars.LEMMATA_REVIEW_MODEL }}
        run: |
          ids=$(tr '\n' ' ' < changed.txt)
          if [ -z "$ids" ]; then
            echo "verdict=skip" >> "$GITHUB_OUTPUT"
            echo "No module changed; nothing to review."
            exit 0
          fi
          set +e
          uv run lemma review $ids --markdown report.md --records-dir reviews --skip-recorded
          code=$?
          set -e
          [ -f report.md ] || printf '## Lemmata review\n\nThe reviewer could not run (exit %s). See the workflow log.\n' "$code" > report.md
          if [ "$code" -eq 0 ]; then echo "verdict=approve" >> "$GITHUB_OUTPUT"; else echo "verdict=deny" >> "$GITHUB_OUTPUT"; fi
      - name: Post the report
        if: steps.review.outputs.verdict != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "$PR" --body-file report.md
      # Pushing with the Actions token raises no pull_request events and the
      # dispatched checks below do not count toward required status checks, so
      # a bot-pushed head needs a human push before it can merge. Set a
      # LEMMATA_BOT_TOKEN secret (a fine-grained token with contents: write) and
      # the records push triggers the checks like any other push.
      - name: Record approvals on the pull request branch
        if: steps.review.outputs.verdict != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ secrets.LEMMATA_BOT_TOKEN || github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ -z "$HEAD_REF" ]; then
            HEAD_REF=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefName -q .headRefName)
          fi
          new=$(git status --porcelain reviews/ | sed -n 's/^?? //p')
          if [ -z "$new" ]; then
            if [ "${{ steps.review.outputs.verdict }}" = "approve" ]; then
              echo "no new records; enabling auto-merge"
              gh pr merge "$PR" --auto --squash || echo "could not enable auto-merge; merge once checks pass"
            fi
            exit 0
          fi
          if [ "$PUSH_TOKEN" != "$GH_TOKEN" ]; then
            # Commit as the token's owner: a push authored by the bot leaves the
            # resulting pull_request run waiting for approval.
            login=$(GH_TOKEN="$PUSH_TOKEN" gh api user -q .login)
            uid=$(GH_TOKEN="$PUSH_TOKEN" gh api user -q .id)
            git config user.name "$login"
            git config user.email "${uid}+${login}@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          git worktree add -q ../prtree pr
          mkdir -p ../prtree/reviews
          for f in $new; do cp "$f" "../prtree/$f"; done
          git -C ../prtree add reviews/
          git -C ../prtree commit -q -m "Record AI review approval for $(tr '\n' ' ' < changed.txt | sed 's/ *$//')"
          # The branch may have moved since the run began (GitHub updates it from
          # main), so replay the records commit onto the current remote head.
          git -C ../prtree fetch -q origin "$HEAD_REF"
          git -C ../prtree rebase -q FETCH_HEAD
          # actions/checkout stores the Actions token as an http.extraheader, which
          # would override the credential in the URL; clear it for this push.
          git -C ../prtree -c "http.https://github.com/.extraheader=" push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$HEAD_REF"
          echo "records pushed for the approved modules"
          if [ "${{ steps.review.outputs.verdict }}" = "approve" ]; then
            # A push made with the Actions token raises no pull_request events, so
            # start the checks on the new head by dispatch, which the token may do.
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"
            gh workflow run review.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF" -f pr="$PR"
            echo "checks dispatched on $HEAD_REF; the next review run will enable auto-merge"
          fi
      - name: Gate on the verdict
        if: steps.review.outputs.verdict == 'deny'
        run: |
          echo "The reviewer denied at least one module. See the report comment."
          exit 1
