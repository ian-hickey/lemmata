[project]
name = "lemmata"
version = "0.0.1"
description = "Reviewed, tested, hash-pinned spreadsheet formulas for AI agents and people."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "anthropic>=1.12.1",
    "ironcalc>=0.8.3",
    "mcp>=2.3.0",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
lemma = "lemmata.cli:main"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lemmata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
