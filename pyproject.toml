[project]
name = "auditable-formulas"
version = "0.0.1"
description = "Reviewed, tested, hash-pinned spreadsheet formulas for AI agents and people."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "ironcalc>=0.8.3",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
af = "af.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/af"]

[tool.pytest.ini_options]
testpaths = ["tests"]
